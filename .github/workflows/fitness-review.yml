# Health & Performance Digest — GitHub Actions
#
# Runs every Sunday at 19:00 UTC. Cadence is auto-detected from the
# training plan (weekly / block_checkin / end_of_programme).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   GARMIN_EMAIL, GARMIN_PASSWORD, HEVY_API_KEY, ANTHROPIC_API_KEY,
#   EMAIL_SENDER, EMAIL_RECIPIENT, GMAIL_APP_PASSWORD,
#   GARMIN_TOKENS_B64, DATABASE_URL, APPLE_HEALTH_WEIGHT_URL  (see DEPLOY.md)

name: Fitness Digest

on:
  schedule:
    # Every Sunday at 19:00 UTC
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      cadence:
        description: "Check-in type"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - weekly
          - block_checkin
          - end_of_programme

jobs:
  fitness-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Garmin OAuth tokens
        run: |
          mkdir -p ~/.garminconnect
          echo "${{ secrets.GARMIN_TOKENS_B64 }}" | base64 -d | tar xz -C ~/.garminconnect

      - name: Determine cadence
        id: cadence
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cadence=${{ github.event.inputs.cadence }}" >> "$GITHUB_OUTPUT"
          else
            echo "cadence=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Run fitness digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APPLE_HEALTH_WEIGHT_URL: ${{ secrets.APPLE_HEALTH_WEIGHT_URL }}
        run: python main.py --cadence ${{ steps.cadence.outputs.cadence }}

      - name: Save updated Garmin tokens
        if: always()
        run: |
          if [ -d ~/.garminconnect ]; then
            echo "::notice::Garmin tokens may have been refreshed. If reviews start failing, re-export tokens."
          fi
